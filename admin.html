<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Acessos · Carteira Inteligente</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="stylesheet" href="app.css">
<style>
body{padding:20px 16px 60px}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:14px}
.ad-row{display:flex;gap:8px;flex-wrap:wrap}.ad-row>*{flex:1 1 160px}
.ad-list{display:grid;gap:6px}
.ad-it{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--linha)}
.ad-it .t{flex:1;min-width:0}.ad-it .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px}
.pill.ativo{background:rgba(34,214,138,.18);color:var(--verde)}.pill.bloqueado{background:rgba(255,77,109,.18);color:var(--vermelho)}
.ad-it button{background:none;border:1px solid var(--linha);color:var(--muted);border-radius:10px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer}
#msg{min-height:18px}
</style>
</head>
<body>
<div class="wrap">
  <header class="page"><h1>Acessos do app</h1><p class="small muted">Libere, bloqueie e veja quem tem acesso.</p></header>
  <section class="card stack" id="boxkey">
    <label class="small muted" for="key">Chave de admin (está no Netlify, variável ADMIN_KEY)</label>
    <div class="inp"><input id="key" type="password" autocomplete="off"></div>
    <button class="btn" id="bkey">Entrar</button>
  </section>
  <section class="card stack" id="boxadm" hidden>
    <div class="ad-row">
      <div class="inp"><input id="em" type="email" placeholder="email@cliente.com" autocapitalize="off"></div>
      <div class="inp"><input id="nm" placeholder="Nome (opcional)"></div>
    </div>
    <div class="ad-row"><button class="btn" id="blib">Liberar acesso</button><button class="btn ghost" id="bblq">Bloquear</button></div>
    <p id="msg" class="small"></p>
  </section>
  <section class="card stack" id="boxlist" hidden>
    <div class="row between"><h3>Compradores</h3><span class="tiny muted" id="cnt"></span></div>
    <div class="inp"><input id="busca" placeholder="Buscar e-mail"></div>
    <div class="ad-list" id="list"></div>
  </section>
</div>
<script>
(() => {
  const $ = s => document.querySelector(s);
  let KEY = ''; try { KEY = sessionStorage.getItem('efr.admkey') || ''; } catch (e) {}
  let ITENS = [], FIXOS = [];
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  async function call(body) {
    const r = await fetch('/api/admin', { method: 'POST', headers: { 'content-type': 'application/json', 'x-admin-key': KEY }, body: JSON.stringify(body) });
    let d = {}; try { d = await r.json(); } catch (e) {}
    return { status: r.status, ...d };
  }
  function draw() {
    const q = ($('#busca').value || '').toLowerCase();
    const arr = ITENS.filter(i => i.email.includes(q));
    const at = ITENS.filter(i => i.status === 'ativo').length;
    $('#cnt').textContent = at + ' ativos · ' + ITENS.length + ' no total' + (FIXOS.length ? ' · ' + FIXOS.length + ' fixos' : '');
    $('#list').innerHTML = arr.map(i => `<div class="ad-it"><div class="t"><b>${esc(i.email)}</b><span class="tiny muted">${esc(i.nome || '')}${i.nome ? ' · ' : ''}${esc(i.origem || '')} · ${esc((i.atualizado || '').slice(0, 10).split('-').reverse().join('/'))}</span></div><span class="pill ${esc(i.status)}">${i.status === 'ativo' ? 'ativo' : 'bloqueado'}</span><button data-e="${esc(i.email)}" data-a="${i.status === 'ativo' ? 'bloquear' : 'liberar'}">${i.status === 'ativo' ? 'Bloquear' : 'Liberar'}</button></div>`).join('') || '<p class="small muted">Ninguém ainda.</p>';
    document.querySelectorAll('#list [data-e]').forEach(b => b.onclick = async () => { const r = await call({ acao: b.dataset.a, email: b.dataset.e }); if (r.ok) load(); });
  }
  async function load() {
    const r = await call({ acao: 'listar' });
    if (r.status === 401) { $('#boxkey').hidden = false; $('#boxadm').hidden = $('#boxlist').hidden = true; alertMsg('Chave incorreta.'); return; }
    if (!r.ok) { alertMsg('Erro ao carregar a lista.'); return; }
    ITENS = r.itens || []; FIXOS = r.fixos || [];
    $('#boxkey').hidden = true; $('#boxadm').hidden = $('#boxlist').hidden = false; draw();
  }
  function alertMsg(t) { const m = $('#msg'); if (m) m.textContent = t; if ($('#boxkey').hidden === false) { let p = $('#kmsg'); if (!p) { p = document.createElement('p'); p.id = 'kmsg'; p.className = 'small'; $('#boxkey').appendChild(p); } p.textContent = t; } }
  async function acao(a) {
    const email = ($('#em').value || '').trim().toLowerCase();
    const r = await call({ acao: a, email, nome: ($('#nm').value || '').trim() });
    $('#msg').textContent = r.ok ? (a === 'liberar' ? '✓ Acesso liberado para ' : '✓ Acesso bloqueado para ') + email : 'Erro: ' + (r.erro || r.status);
    if (r.ok) { $('#em').value = ''; $('#nm').value = ''; load(); }
  }
  $('#bkey').onclick = () => { KEY = $('#key').value.trim(); try { sessionStorage.setItem('efr.admkey', KEY); } catch (e) {} load(); };
  $('#key').onkeydown = e => { if (e.key === 'Enter') $('#bkey').click(); };
  $('#blib').onclick = () => acao('liberar'); $('#bblq').onclick = () => acao('bloquear');
  $('#busca').oninput = draw;
  if (KEY) load();
})();
</script>
</body>
</html>
