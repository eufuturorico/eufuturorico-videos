<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url(../fonts/Inter-SemiBold.woff);font-weight:600}
@font-face{font-family:Inter;src:url(../fonts/Inter-Bold.woff);font-weight:700}
@font-face{font-family:D;src:url(../fonts/InterDisplay-Black.woff);font-weight:900}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;font-family:Inter;color:#F4F6FF;
background:radial-gradient(700px 500px at 85% 40%,rgba(91,124,255,.45),transparent 70%),radial-gradient(600px 420px at 0% 0%,rgba(245,193,61,.18),transparent 70%),#070B1F;position:relative}
.brand{position:absolute;left:64px;top:52px;display:flex;align-items:center;gap:14px;font:900 28px D;color:#F5C13D;letter-spacing:.06em}
.brand img{width:58px;height:58px;border-radius:50%;border:3px solid #F5C13D;background:#08205E}
h1{z-index:5;position:absolute;left:64px;top:140px;font:900 92px/0.95 D;letter-spacing:-.03em;width:600px}
h1 span{background:linear-gradient(92deg,#FFDA6B,#F5C13D 45%,#FF9F43);-webkit-background-clip:text;color:transparent}
.sub{z-index:5;position:absolute;left:64px;top:345px;width:520px;font:600 28px/1.3 Inter;color:#C3C9EA}
.list{display:none!important;position:absolute;left:72px;top:570px;display:grid;gap:16px}
.list div{display:flex;align-items:center;gap:14px;font:700 27px Inter}
.list i{width:36px;height:36px;border-radius:50%;background:rgba(34,214,138,.18);color:#22D68A;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:20px}
.badge{position:absolute;left:64px;bottom:52px;display:inline-flex;align-items:center;gap:12px;padding:18px 28px;border-radius:999px;background:linear-gradient(180deg,#FFDA6B,#F5C13D);color:#1A1300;font:900 28px D;box-shadow:0 14px 40px rgba(245,193,61,.35)}
.phone{position:absolute;width:330px;border-radius:46px;padding:12px;background:linear-gradient(160deg,#2A3266,#0C1233);box-shadow:0 50px 90px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.1) inset}
.phone img{width:100%;border-radius:35px;display:block}
.p1{right:60px;top:40px;width:270px;transform:rotate(5deg);z-index:2}
.p2{right:300px;top:110px;transform:rotate(-7deg);opacity:.85;width:230px}
.chip{position:absolute;z-index:3;right:30px;bottom:40px;display:flex;align-items:center;gap:14px;padding:18px 22px;border-radius:22px;background:rgba(16,23,61,.95);border:1px solid rgba(255,255,255,.12);box-shadow:0 24px 50px rgba(0,0,0,.5)}
.chip b{display:block;font:900 30px D;color:#22D68A}.chip span{font:600 19px Inter;color:#A9B0D6}
.chip .ic{width:52px;height:52px;border-radius:16px;background:rgba(34,214,138,.16);display:grid;place-items:center;font-size:28px}
.masc{position:absolute;right:380px;bottom:40px;width:190px;z-index:4;filter:drop-shadow(0 20px 30px rgba(0,0,0,.6))}
</style></head><body>
<div class="brand"><img src="../img/icon.webp">EU FUTURO RICO</div>
<h1>Carteira <span>Inteligente</span></h1>
<p class="sub">O app que organiza seu dinheiro e analisa ações em instantes.</p>
<div class="list"><div><i>✓</i>Orçamento do mês</div><div><i>✓</i>Análise de 254 ações</div><div><i>✓</i>Carteira e renda passiva</div></div>
<div class="badge">📱 App · acesso vitalício</div>
<div class="phone p2"><img src="../oferta/img/analise.webp"></div>
<div class="phone p1"><img src="../oferta/img/home.webp"></div>
<div class="chip"><span class="ic">✅</span><div><span>Ações da B3 com</span><b>dados oficiais</b></div></div>
</body></html>
