name: Converter fontes para WOFF2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  woff2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fonttools brotli
      - name: Converter
        run: |
          python - <<'PY'
          import glob
          from fontTools.ttLib import TTFont
          for f in glob.glob('fonts/*.woff'):
              t = TTFont(f)
              t.flavor = 'woff2'
              t.save(f[:-5] + '.woff2')
              print(f, '->', f[:-5] + '.woff2')
          PY
          ls -la fonts
      - name: Commit
        run: |
          git config user.name eufuturorico
          git config user.email eufuturorico@users.noreply.github.com
          git add fonts
          git diff --cached --quiet || (git commit -m "fontes: versões WOFF2" && git push origin HEAD:main)
