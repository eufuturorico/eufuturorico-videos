name: Gráficos do app
on:
  schedule:
    - cron: '43 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dados-repo
  cancel-in-progress: false
jobs:
  graficos:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/extras.py graficos
      - name: Salvar
        run: |
          git config user.name eufuturorico
          git config user.email eufuturorico@users.noreply.github.com
          git add data
          git diff --cached --quiet || (git commit -m "dados: gráficos" && git pull --rebase -q origin main && git push origin HEAD:main)
