name: Atualizar dados do app
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      script:
        description: 'script a rodar'
        default: 'atualizar.py'
permissions:
  contents: write
jobs:
  dados:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/${{ github.event.inputs.script || 'atualizar.py' }}
      - name: FIIs, renda fixa e EUA
        if: ${{ !github.event.inputs.script || github.event.inputs.script == 'atualizar.py' }}
        run: python scripts/extras.py || true
      - name: Salvar dados
        run: |
          git config user.name eufuturorico
          git config user.email eufuturorico@users.noreply.github.com
          git add data
          git diff --cached --quiet || (git commit -m "dados: atualização automática" && git push origin HEAD:main)
