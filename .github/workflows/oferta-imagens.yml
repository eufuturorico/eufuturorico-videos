name: Atualizar imagens da página de vendas
on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'app.css'
      - 'index.html'
      - 'img/**'
      - 'scripts/oferta-shots.cjs'
      - 'scripts/og.html'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: oferta-imagens
  cancel-in-progress: true
jobs:
  imagens:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm i --no-save --no-package-lock playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: pip install pillow
      - run: node scripts/oferta-shots.cjs
      - name: Salvar imagens
        run: |
          git config user.name eufuturorico
          git config user.email eufuturorico@users.noreply.github.com
          git add oferta/img
          git diff --cached --quiet || (git commit -m "oferta: imagens atualizadas a partir do app" && git pull --rebase origin main && git push origin HEAD:main)
