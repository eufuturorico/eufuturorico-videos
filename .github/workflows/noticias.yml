name: Notícias do app
on:
  schedule:
    - cron: '7 10,13,16,19,22 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dados-repo
  cancel-in-progress: false
jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/extras.py noticias
      - name: Salvar
        run: |
          git config user.name eufuturorico
          git config user.email eufuturorico@users.noreply.github.com
          git add data/noticias.json
          git diff --cached --quiet || (git commit -m "dados: notícias" && git pull --rebase -q origin main && git push origin HEAD:main)
